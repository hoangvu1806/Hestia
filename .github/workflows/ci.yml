name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      HESTIA_SESSION_DATABASE_URL: postgresql+asyncpg://hestia:hestia@127.0.0.1:5432/hestia
      CUSTOM_LLM_MODEL_1: openai/gpt-4o-mini
      CUSTOM_LLM_MODEL_2: openai/gpt-4o-mini
      ASTA_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest tests -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_HESTIA_API_URL: /api/v1
      NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  containers:
    name: Container build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: hestia-${{ matrix.service }}:ci
          build-args: |
            NEXT_PUBLIC_HESTIA_API_URL=/api/v1
            NEXT_PUBLIC_FIREBASE_API_KEY=test-api-key
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=test.firebaseapp.com
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=test-project
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=test.firebasestorage.app
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=123456789
            NEXT_PUBLIC_FIREBASE_APP_ID=1:123456789:web:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
