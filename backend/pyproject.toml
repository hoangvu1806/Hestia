[project]
name = "hestia-backend"
version = "0.2.0"
description = "Backend API for the Hestia culinary and food-safety assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "firebase-admin>=7.1,<8.0",
    "google-adk[mcp]==2.2.0",
    "litellm>=1.80,<2.0",
    "openpyxl>=3.1,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "rich>=13.9,<15.0",
    "sqlalchemy[asyncio]>=2.0.38,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
