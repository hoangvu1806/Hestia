worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/xml text/xml application/manifest+json image/svg+xml text/css text/plain;

    upstream hestia_backend {
        server backend:8484;
        keepalive 16;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 16m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Search Engine & AI Discovery files
        location = /robots.txt {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            add_header Content-Type "text/plain; charset=utf-8";
            try_files $uri =404;
        }

        location = /sitemap.xml {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            add_header Content-Type "application/xml; charset=utf-8";
            try_files $uri =404;
        }

        location ~ ^/(llms|llms-full)\.txt$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            add_header Content-Type "text/plain; charset=utf-8";
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Content-Type "application/manifest+json; charset=utf-8";
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://hestia_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            add_header X-Accel-Buffering no;
        }

        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = / {
            return 308 /home/;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }
    }
}
